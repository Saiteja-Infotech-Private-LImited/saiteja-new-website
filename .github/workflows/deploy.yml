name: Deploy Website to AWS

on:
  push:
    branches:
      - main  # Runs when code is pushed or a PR is merged into main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Ensure this matches your project's node version

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Sync dist folder to S3 Bucket
        run: aws s3 sync dist/ s3://saiteja-new-website-2026 --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id E2U8UTJJ86BNPO --paths "/*"
      - name: Notify Discord
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" == "success" ]; then
            MSG="✅ **Website Deployment Succeeded** for ${{ github.repository }} (${{ github.ref_name }})"
          else
            MSG="❌ **Website Deployment Failed** for ${{ github.repository }} (${{ github.ref_name }})\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          curl -H "Content-Type: application/json" -d "{\"content\": \"$MSG\"}" "$WEBHOOK_URL"
